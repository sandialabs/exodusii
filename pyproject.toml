[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "exodusii"
version = "26.11.12"
description = "A modern pure-Python interface for Sandia Exodus II finite element databases."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Timothy Jesse Fuller" }
]
keywords = [
  "exodus",
  "exodusii",
  "finite-elements",
  "netcdf",
  "mesh",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0",
  "netCDF4>=1.7",
  "PyYAML>=6.0",
]


[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pyright>=1.1",
  "ty>=0.0.1a0",
  "sphinx>=7.0",
  "numpydoc>=1.7",
  "furo>=2024.1.29",
  "sphinx-copybutton>=0.5",
]

[project.scripts]
exoread = "exodusii.cli.exoread:main"
# Legacy name installed by exodusii < 2; still invoked by downstream test scripts.
"exoread.py" = "exodusii.cli.exoread:main"


[project.urls]
Homepage = "https://github.com/sandialabs/exodusii"
Repository = "https://github.com/sandialabs/exodusii"
Issues = "https://github.com/sandialabs/exodusii/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["exodusii*"]

# Non-Python files installed with the package.  ``data/agent`` has no
# ``__init__.py``, so it must be listed explicitly rather than discovered.
[tool.setuptools.package-data]
exodusii = [
  "py.typed",
  "data/*.json",
  "data/agent/*.md.in",
]

[tool.pytest.ini_options]
addopts = "--durations=20 -ra --import-mode=importlib"
testpaths = ["tests"]
norecursedirs = ["data"]
python_files = ["*.py"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "id_map_warnings: do not suppress the parallel missing node/element map warning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = true
docstring-code-line-length = "dynamic"
docstring-code-format = false

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "RUF",
]
ignore = [ "E731", "E741", "F841", "B905" ]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["exodusii"]

[tool.bandit]
skips = [
    "B101",  # assert used — acceptable in internal parsing helpers
    "B110",  # try/except/pass — intentional fallback in diff/mesh matching
    "B112",  # try/except/continue — intentional fallback in diff/mesh matching
    "B404",  # subprocess import — used for epu parallel-merge utility
    "B603",  # subprocess call without shell=True — input is a fixed executable path
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"


[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "netCDF4", "netCDF4.*"]
follow_imports = "skip"
ignore_missing_imports = true
