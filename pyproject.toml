[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "exodusii"
version = "0.1.0a0"
description = "A modern pure-Python interface for Sandia Exodus II finite element databases."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "Timothy Jesse Fuller" }
]
keywords = [
  "exodus",
  "exodusii",
  "finite-elements",
  "netcdf",
  "mesh",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0",
  "netCDF4>=1.7",
]


[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pyright>=1.1",
]

[project.scripts]
exoread = "exodusii.cli.exoread:main"


[project.urls]
Homepage = "https://github.com/sandialabs/exodusii"
Repository = "https://github.com/sandialabs/exodusii"
Issues = "https://github.com/sandialabs/exodusii/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/exodusii"]

[tool.hatch.build.targets.wheel.force-include]
"src/exodusii/data/capabilities.json" = "exodusii/data/capabilities.json"
"src/exodusii/data/skills.json" = "exodusii/data/skills.json"

[tool.pytest.ini_options]
addopts = "--durations=20 -ra"
testpaths = ["."]
norecursedirs = ["data"]
python_files = ["*.py"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = true
docstring-code-line-length = "dynamic"
docstring-code-format = false

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "RUF",
]
ignore = [ "E731", "E741", "F841" ]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["exodusii"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
